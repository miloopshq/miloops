# Publishes the `miloops` CLI to npm. Run it from Actions → Release → Run workflow, or:
#   gh workflow run release.yml -f channel=next                    a prerelease to try: npx miloops-cli@next
#   gh workflow run release.yml -f channel=latest                  a stable release of packages/cli/package.json's version
#   gh workflow run release.yml -f channel=latest -f version=0.8.0 a stable release of a version you name
#   gh workflow run release.yml -f channel=stub                    refresh the "coming soon" placeholder on `latest`
# next:   <upcoming>-next.<run>, where <upcoming> is the package.json version (or the patch after npm's latest
#         if that is higher). Only the `next` dist-tag moves; `latest` is never touched.
# latest: must be higher than npm's latest. Publishes it as `latest`, then tags the commit vX.Y.Z and creates
#         the GitHub release with generated notes.
# stub:   until launch, `latest` is a placeholder (.github/stub/) that only prints "not released yet". This
#         publishes it again as the next 0.0.x, so the npm page shows the current README and links. It refuses
#         once a real release is on `latest`.
# Publishing uses npm trusted publishing (OIDC), so there is no npm token: on npmjs.com, the miloops package
# trusts this repository's release.yml. Every version gets provenance pointing at the commit and this run.
name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'next: a prerelease for testing (npx miloops-cli@next). latest: a stable release. stub: refresh the pre-launch placeholder.'
        type: choice
        options: [next, latest, stub]
        default: next
      version:
        description: 'latest only, optional: the version to release (e.g. 0.8.0). Defaults to packages/cli/package.json.'
        required: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - id: chrome
        if: inputs.channel != 'stub'
        uses: browser-actions/setup-chrome@v1
      - run: |
          git config --global user.name "MILOOPS CI"
          git config --global user.email "ci@miloops.app"
      - name: Version
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
          REQUESTED: ${{ inputs.version }}
        run: node .github/scripts/release-version.mjs >> "$GITHUB_OUTPUT"
      - name: Publish the placeholder
        if: inputs.channel == 'stub'
        run: |
          cp LICENSE .github/stub/LICENSE
          cd .github/stub
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm publish --tag latest --access public --provenance
      - run: npm ci
        if: inputs.channel != 'stub'
      - name: Set the package version
        if: inputs.channel != 'stub'
        run: npm version "${{ steps.version.outputs.version }}" -w miloops-cli --no-git-tag-version --allow-same-version
      - run: npm run check
        if: inputs.channel != 'stub'
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: Publish to npm
        if: inputs.channel != 'stub'
        run: npm publish -w miloops-cli --tag "${{ inputs.channel }}" --access public --provenance
      - name: Tag and GitHub release
        if: inputs.channel == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
      - name: Summary
        run: |
          v="${{ steps.version.outputs.version }}"
          tag="${{ inputs.channel }}"
          [ "$tag" = stub ] && tag=latest
          echo "Published miloops-cli@$v as \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Try it: \`npx miloops-cli@$v\`" >> "$GITHUB_STEP_SUMMARY"
