# Preview release: run by hand on any branch (Actions → Publish next → Run workflow) to publish it as
# miloops@<version>-next.<run> under the `next` tag, so `npm i -g miloops@next` tries it before it is merged.
# `latest` is never touched.
name: Publish next

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - run: |
          git config --global user.name "MILOOPS CI"
          git config --global user.email "ci@miloops.app"
      - run: npm ci
      - run: npm run check
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: Prerelease version
        id: version
        run: |
          base=$(node -p "require('./packages/cli/package.json').version")
          v="$base-next.$GITHUB_RUN_NUMBER"
          npm version "$v" -w miloops --no-git-tag-version
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: npm publish -w miloops --tag next --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: echo "Published miloops@${{ steps.version.outputs.version }} · npm i -g miloops@next" >> "$GITHUB_STEP_SUMMARY"
